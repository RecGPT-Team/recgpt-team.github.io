<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8faf9">
    <meta name="description" content="RecGPT Team">
    <title>RecGPT Team</title>
    <link rel="icon" type="image/svg+xml" href="./logo.svg">
    <style>
      :root { color-scheme: light; background: #f8faf9; color: #172d29; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
      .identity { display: flex; flex-direction: column; align-items: center; gap: 32px; text-align: center; }
      .logo { display: block; width: clamp(112px, 18vw, 152px); height: auto; }
      h1 { margin: 0; font-size: clamp(32px, 5.5vw, 48px); font-weight: 600; line-height: 1.15; letter-spacing: -0.045em; }
    </style>
  </head>
  <body>
    <main>
      <div class="identity">
        <img class="logo" src="./logo.svg" width="160" height="160" alt="RecGPT Team logo">
        <h1>RecGPT Team</h1>
      </div>
    </main>
  </body>
</html>
