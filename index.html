<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fdf8f4">
    <meta name="description" content="RecGPT Team">
    <title>RecGPT Team</title>
    <link rel="icon" type="image/jpeg" href="./logo.jpg">
    <style>
      :root { color-scheme: light; background: #fdf8f4; color: #2d2c2a; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
      .identity { display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
      .logo { display: block; width: clamp(200px, 28vw, 240px); max-width: 100%; height: auto; }
      h1 { margin: 0; font-size: clamp(32px, 5.5vw, 40px); font-weight: 600; line-height: 1.15; letter-spacing: -0.04em; }
      .project-link { display: inline-flex; align-items: center; justify-content: center; gap: 20px; min-height: 52px; margin-top: 12px; padding: 14px 24px; border-radius: 12px; background: #ff7a24; color: #2d2c2a; font-size: 16px; font-weight: 600; line-height: 24px; text-decoration: none; }
      .project-link:hover { background: #f36d18; }
      .project-link:focus-visible { outline: 3px solid #2d2c2a; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <div class="identity">
        <img class="logo" src="./logo.jpg" width="460" height="460" alt="RecGPT logo">
        <h1>RecGPT Team</h1>
        <a class="project-link" href="https://recgpt-team.github.io/UserArena-Page/">UserArena Page <span aria-hidden="true">→</span></a>
      </div>
    </main>
  </body>
</html>
